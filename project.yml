name: Indexator
options:
  bundleIdPrefix: io.github.alexeytatarinov
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Indexator:
    type: application
    platform: iOS
    sources:
      - Indexator/Sources
    info:
      path: Indexator/Info.plist
      properties:
        CFBundleDisplayName: Indexator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexeytatarinov.indexator
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
