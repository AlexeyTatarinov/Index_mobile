name: Indexator
options:
  bundleIdPrefix: io.github.alexeytatarinov
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Indexator:
    type: application
    platform: iOS
    sources:
      - Indexator/Sources
      # Downloaded and compiled in CI (see .github/workflows/build.yml), kept as a folder reference.
      - path: Indexator/Resources/Models
        type: folder
    info:
      path: Indexator/Info.plist
      properties:
        CFBundleDisplayName: Indexator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: Indexator строит на телефоне поисковый индекс по твоим фото. Ничего не отправляется в интернет.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexeytatarinov.indexator
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
