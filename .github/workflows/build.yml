name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -project Indexator.xcodeproj \
            -scheme Indexator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Indexator.app Payload/
          zip -qry Indexator.ipa Payload
          ls -lh Indexator.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Indexator-unsigned-ipa
          path: Indexator.ipa
          retention-days: 30
