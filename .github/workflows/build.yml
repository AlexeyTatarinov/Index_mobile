name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: model-cache
          key: models-${{ hashFiles('scripts/fetch-models.sh', 'scripts/convert-mclip.py', 'scripts/requirements-convert.txt') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and compile models
        run: ./scripts/fetch-models.sh model-cache Indexator/Resources/Models

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache text embedding model
        uses: actions/cache@v4
        with:
          path: model-cache-e5
          key: e5-${{ hashFiles('scripts/convert-e5.py', 'scripts/requirements-e5.txt', 'scripts/fetch-e5.sh') }}

      - name: Convert and compile text embedding model
        run: ./scripts/fetch-e5.sh model-cache-e5 Indexator/Resources/Models

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -project Indexator.xcodeproj \
            -scheme Indexator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Indexator.app Payload/
          zip -qry Indexator.ipa Payload
          ls -lh Indexator.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Indexator-unsigned-ipa
          path: Indexator.ipa
          retention-days: 30

  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: model-cache
          key: models-${{ hashFiles('scripts/fetch-models.sh', 'scripts/convert-mclip.py', 'scripts/requirements-convert.txt') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and compile models
        run: ./scripts/fetch-models.sh model-cache Indexator/Resources/Models

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache text embedding model
        uses: actions/cache@v4
        with:
          path: model-cache-e5
          key: e5-${{ hashFiles('scripts/convert-e5.py', 'scripts/requirements-e5.txt', 'scripts/fetch-e5.sh') }}

      - name: Convert and compile text embedding model
        run: ./scripts/fetch-e5.sh model-cache-e5 Indexator/Resources/Models

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run in simulator and take screenshots
        run: ./scripts/screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 30

      - name: Publish screenshots to the screenshots branch
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: ./scripts/publish-screenshots.sh
